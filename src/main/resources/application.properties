spring.application.name=finance-data-processing

spring.datasource.url = jdbc:mysql://localhost:3306/finance_db?createDatabaseIfNotExist = true

spring.datasource.username =  root
spring.datasource.password = password
spring.datasource.driver-class-name = com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql = true
spring.jpa.properties.hibernate.format_sql = true

app.jwtSecret=mySecretKeyForJWTGenerationThatIsAtLeast32BytesLong1234567890
app.jwtExpirationMs=86400000
